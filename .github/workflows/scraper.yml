name: Dubizzle Toyota Scraper Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [cron_trigger]

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # السماح بكتابة Commit في المستودع

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
          SCRAPINGANT_API_KEY2: ${{ secrets.SCRAPINGANT_API_KEY2 }}
          SCRAPINGANT_API_KEY3: ${{ secrets.SCRAPINGANT_API_KEY3 }}
          SCRAPINGANT_API_KEY4: ${{ secrets.SCRAPINGANT_API_KEY4 }}
          SCRAPINGANT_API_KEY5: ${{ secrets.SCRAPINGANT_API_KEY5 }}
          SCRAPINGANT_API_KEY6: ${{ secrets.SCRAPINGANT_API_KEY6 }}
          SCRAPINGANT_API_KEY7: ${{ secrets.SCRAPINGANT_API_KEY7 }}
        run: python main.py

      - name: Commit and Push DB if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_ads.db || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update sent_ads.db [skip ci]" && git push)