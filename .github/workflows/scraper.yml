name: Dubizzle Toyota Scraper Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [cron_trigger]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
          SCRAPINGANT_API_KEY2: ${{ secrets.SCRAPINGANT_API_KEY2 }}
          SCRAPINGANT_API_KEY3: ${{ secrets.SCRAPINGANT_API_KEY3 }}
          SCRAPINGANT_API_KEY4: ${{ secrets.SCRAPINGANT_API_KEY4 }}
          SCRAPINGANT_API_KEY5: ${{ secrets.SCRAPINGANT_API_KEY5 }}
          SCRAPINGANT_API_KEY6: ${{ secrets.SCRAPINGANT_API_KEY6 }}
          SCRAPINGANT_API_KEY7: ${{ secrets.SCRAPINGANT_API_KEY7 }}
        run: python main.py