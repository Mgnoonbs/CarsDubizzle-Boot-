name: Dubizzle Toyota Scraper Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [cron_trigger]

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore DB Cache
        uses: actions/cache@v4
        with:
          path: sent_ads.db
          key: sent-ads-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            sent-ads-db-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          SCRAPER_API_KEY2: ${{ secrets.SCRAPER_API_KEY2 }}
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
          SCRAPINGANT_API_KEY2: ${{ secrets.SCRAPINGANT_API_KEY2 }}
        run: python main.py

      - name: Save DB Cache
        uses: actions/cache@v4
        if: always()
        with:
          path: sent_ads.db
          key: sent-ads-db-${{ runner.os }}-${{ github.run_id }}