name: Dubizzle Toyota Scraper Bot



on:

  schedule:

    # يعمل تلقائياً كل 15 دقيقة (يمكنك تعديل التوقيت حسب الرغبة)

    - cron: '*/15 * * * *'

  repository_dispatch:

    types: [cron_trigger]

  workflow_dispatch:



jobs:

  run-scraper:

    runs-on: ubuntu-latest



    permissions:

      contents: write  # إعطاء صلاحية الكتابة لتحديث قاعدة البيانات sent_ads.db



    steps:

      - name: Checkout Repository

        uses: actions/checkout@v4

        with:

          persist-credentials: true



      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: '3.11'



      - name: Install Dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt



      - name: Run Scraper Script

        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          CHAT_ID: ${{ secrets.CHAT_ID }}

          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}

          SCRAPINGANT_API_KEY2: ${{ secrets.SCRAPINGANT_API_KEY2 }}

        run: python main.py



      - name: Commit and Push Updated DB

        if: always()

        run: |

          git config --global user.name "github-actions[bot]"

          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add sent_ads.db

          git commit -m "update sent_ads.db [skip ci]" || exit 0

          git pull --rebase origin main

          git push 